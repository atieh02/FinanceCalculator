<div class="calculator-layout"><section class="calc-card"><h2>Your finances</h2><div class="field"><label for="ha-income">Annual household income (before tax)</label><div class="input-wrap"><span>$</span><input id="ha-income" type="number" min="0" max="1000000000000" value="100000" inputmode="decimal"></div></div><div class="field"><label for="ha-debts">Monthly debt payments</label><div class="input-wrap"><span>$</span><input id="ha-debts" type="number" min="0" max="1000000000000" value="500" inputmode="decimal"></div><small>Car, student loan and credit card minimums. Not rent or living costs.</small></div><div class="field"><label for="ha-down">Down payment</label><div class="input-wrap"><span>$</span><input id="ha-down" type="number" min="0" max="1000000000000" value="60000" inputmode="decimal"></div></div><div class="row"><div class="field"><label for="ha-rate">Interest rate</label><div class="input-wrap"><input id="ha-rate" type="number" min="0" max="100" step="0.01" value="6.5" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="ha-term">Loan term</label><select id="ha-term"><option value="30" selected>30 years</option><option value="20">20 years</option><option value="15">15 years</option><option value="10">10 years</option></select></div></div><div class="row"><div class="field"><label for="ha-tax">Property tax rate</label><div class="input-wrap"><input id="ha-tax" type="number" min="0" max="10" step="0.01" value="1.1" inputmode="decimal"><span>%/yr</span></div></div><div class="field"><label for="ha-ins">Home insurance</label><div class="input-wrap"><span>$</span><input id="ha-ins" type="number" min="0" max="1000000" value="1500" inputmode="decimal"><span>/yr</span></div></div></div><div class="row"><div class="field"><label for="ha-hoa">HOA dues</label><div class="input-wrap"><span>$</span><input id="ha-hoa" type="number" min="0" max="100000" value="0" inputmode="decimal"><span>/mo</span></div></div><div class="field"><label for="ha-dti">Debt-to-income limits</label><select id="ha-dti"><option value="28/36" selected>28% / 36% (conservative)</option><option value="31/43">31% / 43% (FHA-style)</option><option value="36/45">36% / 45% (aggressive)</option></select></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">You could afford a home of about</span><div id="ha-price" class="result-number">—</div><div class="stat-row"><span>Max monthly housing payment</span><strong id="ha-payment">—</strong></div><div class="stat-row"><span>Loan amount</span><strong id="ha-loan">—</strong></div><div class="stat-row"><span>Principal &amp; interest</span><strong id="ha-pi">—</strong></div><div class="stat-row"><span>Taxes, insurance &amp; HOA</span><strong id="ha-tih">—</strong></div><div class="stat-row"><span>Down payment share</span><strong id="ha-downpct">—</strong></div><div class="chart" id="ha-chart"></div><p id="ha-note" class="notice"></p></aside></div>
