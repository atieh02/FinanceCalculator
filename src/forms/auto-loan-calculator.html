<div class="calculator-layout"><section class="calc-card"><h2>Car and loan details</h2><div class="field"><label for="al-price">Vehicle price</label><div class="input-wrap"><span>$</span><input id="al-price" type="number" min="0" max="100000000" value="35000" inputmode="decimal"></div></div><div class="row"><div class="field"><label for="al-trade">Trade-in value</label><div class="input-wrap"><span>$</span><input id="al-trade" type="number" min="0" max="100000000" value="5000" inputmode="decimal"></div></div><div class="field"><label for="al-down">Down payment</label><div class="input-wrap"><span>$</span><input id="al-down" type="number" min="0" max="100000000" value="3000" inputmode="decimal"></div></div></div><div class="row"><div class="field"><label for="al-tax">Sales tax rate</label><div class="input-wrap"><input id="al-tax" type="number" min="0" max="20" step="0.01" value="6" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="al-fees">Fees (title, registration, doc)</label><div class="input-wrap"><span>$</span><input id="al-fees" type="number" min="0" max="1000000" value="800" inputmode="decimal"></div></div></div><div class="row"><div class="field"><label for="al-rate">APR</label><div class="input-wrap"><input id="al-rate" type="number" min="0" max="50" step="0.01" value="7" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="al-term">Loan term</label><select id="al-term"><option value="36">36 months</option><option value="48">48 months</option><option value="60" selected>60 months</option><option value="72">72 months</option><option value="84">84 months</option></select></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Estimated monthly payment</span><div id="al-payment" class="result-number">—</div><div class="stat-row"><span>Amount financed</span><strong id="al-financed">—</strong></div><div class="stat-row"><span>Sales tax</span><strong id="al-taxamt">—</strong></div><div class="stat-row"><span>Total interest</span><strong id="al-interest">—</strong></div><div class="stat-row"><span>Total cost of the car</span><strong id="al-total">—</strong></div><div class="chart" id="al-chart"></div><p id="al-note" class="notice"></p></aside></div>
