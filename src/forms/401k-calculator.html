<div class="calculator-layout"><section class="calc-card"><h2>You and your plan</h2><div class="row three"><div class="field"><label for="k-age">Current age</label><input id="k-age" type="number" min="18" max="80" value="30" inputmode="numeric"></div><div class="field"><label for="k-retire">Retirement age</label><input id="k-retire" type="number" min="19" max="85" value="65" inputmode="numeric"></div><div class="field"><label for="k-balance">Current balance</label><div class="input-wrap"><span>$</span><input id="k-balance" type="number" min="0" max="100000000" value="25000" inputmode="decimal"></div></div></div><div class="row"><div class="field"><label for="k-salary">Annual salary</label><div class="input-wrap"><span>$</span><input id="k-salary" type="number" min="0" max="100000000" value="70000" inputmode="decimal"></div></div><div class="field"><label for="k-contrib">You contribute</label><div class="input-wrap"><input id="k-contrib" type="number" min="0" max="100" step="0.5" value="8" inputmode="decimal"><span>% of pay</span></div></div></div><div class="row"><div class="field"><label for="k-matchrate">Employer matches</label><div class="input-wrap"><input id="k-matchrate" type="number" min="0" max="200" step="1" value="50" inputmode="decimal"><span>% of yours</span></div></div><div class="field"><label for="k-matchcap">Up to</label><div class="input-wrap"><input id="k-matchcap" type="number" min="0" max="100" step="0.5" value="6" inputmode="decimal"><span>% of pay</span></div></div></div><div class="row three"><div class="field"><label for="k-raise">Yearly raise</label><div class="input-wrap"><input id="k-raise" type="number" min="0" max="20" step="0.1" value="3" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="k-return">Annual return</label><div class="input-wrap"><input id="k-return" type="number" min="0" max="20" step="0.1" value="7" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="k-infl">Inflation</label><div class="input-wrap"><input id="k-infl" type="number" min="0" max="15" step="0.1" value="2.5" inputmode="decimal"><span>%</span></div></div></div><div class="field"><label for="k-limit">IRS contribution limit</label><select id="k-limit"><option value="1" selected>Apply 2026 limits (incl. catch-up at 50+)</option><option value="0">Ignore limits</option></select></div></section><aside class="result-card" aria-live="polite"><span class="result-label">401(k) balance at retirement</span><div id="k-result" class="result-number">—</div><div class="stat-row"><span>In today's dollars</span><strong id="k-today">—</strong></div><div class="stat-row"><span>Your contributions</span><strong id="k-yours">—</strong></div><div class="stat-row"><span>Employer match (free money)</span><strong id="k-employer">—</strong></div><div class="stat-row"><span>Investment growth</span><strong id="k-growth">—</strong></div><div class="stat-row"><span>Monthly income at 4% withdrawal</span><strong id="k-income">—</strong></div><div class="chart" id="k-chart"></div><p id="k-note" class="notice"></p></aside></div>
