<div class="calculator-layout"><section class="calc-card"><h2>Inputs</h2><div class="field"><label for="principal">Starting balance</label><div class="input-wrap"><span>$</span><input id="principal" type="number" inputmode="decimal" min="0" max="1000000000000" value="10000"></div><small>Amount invested or saved today.</small></div><div class="field"><label for="contribution">Monthly contribution</label><div class="input-wrap"><span>$</span><input id="contribution" type="number" inputmode="decimal" min="0" max="1000000000000" value="500"></div><small>Assumed contribution made throughout the year.</small></div><div class="row"><div class="field"><label for="compound-rate">Annual return / rate</label><div class="input-wrap"><input id="compound-rate" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="7"><span>%</span></div></div><div class="field"><label for="compound-years">Time</label><div class="input-wrap"><input id="compound-years" type="number" inputmode="decimal" min="1" max="100" value="20"><span>yr</span></div></div></div><div class="field"><label for="frequency">Compounding periods per year</label><select id="frequency"><option value="1">Annually</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select><small>This changes the mathematical compounding frequency, not the frequency of your contribution.</small></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Projected ending balance</span><div id="compound-result" class="result-number">$273,000</div><div class="stat-row"><span>Your contributions</span><strong id="compound-contributions">—</strong></div><div class="stat-row"><span>Modeled growth</span><strong id="compound-growth">—</strong></div><div class="stat-row"><span>Rate</span><strong id="compound-rate-display">—</strong></div><p id="compound-note" class="notice"></p><div class="chart" id="compound-chart"></div></aside></div>
