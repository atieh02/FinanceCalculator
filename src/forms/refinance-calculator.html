<div class="calculator-layout"><section class="calc-card"><h2>Current mortgage</h2><div class="field"><label for="rf-balance">Current loan balance</label><div class="input-wrap"><span>$</span><input id="rf-balance" type="number" min="0" max="100000000" value="280000" inputmode="decimal"></div></div><div class="row"><div class="field"><label for="rf-rate">Current interest rate</label><div class="input-wrap"><input id="rf-rate" type="number" min="0" max="30" step="0.01" value="7.25" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="rf-years">Years remaining</label><div class="input-wrap"><input id="rf-years" type="number" min="1" max="40" value="27" inputmode="decimal"><span>yr</span></div></div></div><h2 style="margin-top:22px">New loan</h2><div class="row"><div class="field"><label for="rf-newrate">New interest rate</label><div class="input-wrap"><input id="rf-newrate" type="number" min="0" max="30" step="0.01" value="6" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="rf-term">New loan term</label><select id="rf-term"><option value="30" selected>30 years</option><option value="25">25 years</option><option value="20">20 years</option><option value="15">15 years</option><option value="10">10 years</option></select></div></div><div class="row"><div class="field"><label for="rf-costs">Closing costs</label><div class="input-wrap"><span>$</span><input id="rf-costs" type="number" min="0" max="1000000" value="6000" inputmode="decimal"></div></div><div class="field"><label for="rf-roll">Pay closing costs</label><select id="rf-roll"><option value="0" selected>Upfront, in cash</option><option value="1">Roll into the new loan</option></select></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">New monthly payment</span><div id="rf-newpay" class="result-number">—</div><div class="stat-row"><span>Current payment</span><strong id="rf-oldpay">—</strong></div><div class="stat-row"><span>Monthly savings</span><strong id="rf-save">—</strong></div><div class="stat-row"><span>Break-even point</span><strong id="rf-breakeven">—</strong></div><div class="stat-row"><span>Interest left on current loan</span><strong id="rf-oldint">—</strong></div><div class="stat-row"><span>Interest on new loan</span><strong id="rf-newint">—</strong></div><div class="stat-row"><span>Lifetime savings</span><strong id="rf-net">—</strong></div><p id="rf-note" class="notice"></p></aside></div>
