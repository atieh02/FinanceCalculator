<div class="calculator-layout"><section class="calc-card"><h2>Inputs</h2><div class="field"><label for="income">Take-home income</label><div class="input-wrap"><span>$</span><input id="income" type="number" inputmode="decimal" min="0" max="1000000000000" value="5000"></div><small>Use after-tax income for the standard framework.</small></div><div class="field"><label for="period">Income frequency</label><select id="period"><option value="monthly" selected>Monthly</option><option value="annual">Annual</option></select><small>Annual income is divided by 12.</small></div><div class="row three"><div class="field"><label for="needs-pct">Needs %</label><input id="needs-pct" type="number" inputmode="decimal" min="0" max="100" value="50"></div><div class="field"><label for="wants-pct">Wants %</label><input id="wants-pct" type="number" inputmode="decimal" min="0" max="100" value="30"></div><div class="field"><label for="savings-pct">Savings %</label><input id="savings-pct" type="number" inputmode="decimal" min="0" max="100" value="20"></div></div><p id="budget-warning" class="notice"></p></section><aside class="result-card" aria-live="polite"><span class="result-label">Monthly income allocated</span><div id="budget-monthly" class="result-number">$5,000</div><div class="bar"><div id="needs-bar" class="needs" style="width:50%">Needs</div><div id="wants-bar" class="wants" style="width:30%">Wants</div><div id="savings-bar" class="savings" style="width:20%">Savings</div></div><div class="stat-row"><span>Needs</span><strong id="budget-needs">$2,500</strong></div><div class="stat-row"><span>Wants</span><strong id="budget-wants">$1,500</strong></div><div class="stat-row"><span>Savings</span><strong id="budget-savings">$1,000</strong></div></aside></div>
