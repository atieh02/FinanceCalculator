<div class="calculator-layout"><section class="calc-card"><h2>Inflation inputs</h2><div class="field"><label for="in-amount">Amount today</label><div class="input-wrap"><span>$</span><input id="in-amount" type="number" min="0" max="1000000000000" value="100" inputmode="decimal"></div></div><div class="row"><div class="field"><label for="in-years">Years from now</label><div class="input-wrap"><input id="in-years" type="number" min="1" max="100" value="20" inputmode="numeric"><span>yr</span></div></div><div class="field"><label for="in-rate">Average inflation</label><div class="input-wrap"><input id="in-rate" type="number" min="-10" max="50" step="0.1" value="3" inputmode="decimal"><span>%/yr</span></div></div></div><p class="field-help">Tip: 2% is the Federal Reserve's long-run target; many planners use 2.5–3.5% for long-term goals.</p></section><aside class="result-card" aria-live="polite"><span class="result-label">Future cost of the same things</span><div id="in-future" class="result-number">—</div><div class="stat-row"><span>What today's cash will be worth</span><strong id="in-power">—</strong></div><div class="stat-row"><span>Purchasing power lost</span><strong id="in-lost">—</strong></div><div class="stat-row"><span>Years for prices to double</span><strong id="in-double">—</strong></div><div class="chart" id="in-chart"></div><p id="in-note" class="notice"></p></aside></div>
