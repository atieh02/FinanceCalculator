<div class="calculator-layout"><section class="calc-card"><h2>Inputs</h2><div class="field"><label for="home-price">Home price</label><div class="input-wrap"><span>$</span><input id="home-price" type="number" inputmode="decimal" min="0" max="1000000000000" value="400000"></div><small>Total purchase price before the down payment.</small></div><div class="field"><label for="down-payment">Down payment</label><div class="input-wrap"><span>$</span><input id="down-payment" type="number" inputmode="decimal" min="0" max="1000000000000" value="80000"></div><small>The calculator uses the remaining amount as the loan.</small></div><div class="row"><div class="field"><label for="rate">Interest rate</label><div class="input-wrap"><input id="rate" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="6.5"><span>%</span></div></div><div class="field"><label for="term">Loan term</label><div class="input-wrap"><input id="term" type="number" inputmode="decimal" min="1" max="100" value="30"><span>yr</span></div></div></div><div class="row"><div class="field"><label for="property-tax">Property tax per year</label><div class="input-wrap"><span>$</span><input id="property-tax" type="number" inputmode="decimal" min="0" max="1000000000000" value="4400"></div></div><div class="field"><label for="insurance">Home insurance per year</label><div class="input-wrap"><span>$</span><input id="insurance" type="number" inputmode="decimal" min="0" max="1000000000000" value="1500"></div></div></div><div class="row"><div class="field"><label for="hoa">HOA per month</label><div class="input-wrap"><span>$</span><input id="hoa" type="number" inputmode="decimal" min="0" max="1000000000000" value="0"></div></div><div class="field"><label for="pmi">PMI annual rate if down payment is under 20%</label><div class="input-wrap"><input id="pmi" type="number" inputmode="decimal" min="0" max="10" step="0.01" value="0.6"><span>%</span></div></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Estimated monthly payment</span><div id="mortgage-payment" class="result-number">$2,700</div><div class="stat-row"><span>Principal &amp; interest</span><strong id="principal-interest">—</strong></div><div class="stat-row"><span>Loan amount</span><strong id="mortgage-loan">—</strong></div><div class="stat-row"><span>Estimated PMI</span><strong id="mortgage-pmi">—</strong></div><div class="stat-row"><span>Total interest over term</span><strong id="mortgage-interest">—</strong></div><p id="mortgage-note" class="notice"></p><div class="chart" id="mortgage-chart"></div></aside></div>
