<div class="calculator-layout"><section class="calc-card"><h2>Your plan</h2><div class="field"><label for="cw-monthly">Monthly investment</label><div class="input-wrap"><span>$</span><input id="cw-monthly" type="number" min="0" max="10000000" value="300" inputmode="decimal"></div></div><div class="row"><div class="field"><label for="cw-return">Expected yearly return</label><div class="input-wrap"><input id="cw-return" type="number" min="0" max="20" step="0.1" value="7" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="cw-years">Years until you need it</label><div class="input-wrap"><input id="cw-years" type="number" min="1" max="70" value="35" inputmode="numeric"><span>yr</span></div></div></div><div class="field"><label for="cw-delay">Years you might wait</label><div class="input-wrap"><input id="cw-delay" type="number" min="0" max="69" value="10" inputmode="numeric"><span>yr</span></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Waiting could cost you</span><div id="cw-cost" class="result-number">—</div><div class="method-grid"><div class="method best" id="cw-now-card"><h3>Start now</h3><strong id="cw-now">—</strong><span class="result-label">Balance at the end</span></div><div class="method" id="cw-later-card"><h3>Wait <span id="cw-delay-label">10</span> yr</h3><strong id="cw-later">—</strong><span class="result-label">Balance at the end</span></div></div><div class="stat-row"><span>Monthly amount to catch up after waiting</span><strong id="cw-catchup">—</strong></div><p id="cw-note" class="notice"></p></aside></div>
