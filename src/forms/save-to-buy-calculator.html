<div class="calculator-layout"><section class="calc-card"><h2>What you're buying</h2><div class="field"><label for="sb-price">Price today</label><div class="input-wrap"><span>$</span><input id="sb-price" type="number" min="0" max="100000000" value="25000" inputmode="decimal"></div><small>A car, home, wedding, tuition or any big purchase.</small></div><div class="row"><div class="field"><label for="sb-saved">Already saved</label><div class="input-wrap"><span>$</span><input id="sb-saved" type="number" min="0" max="100000000" value="5000" inputmode="decimal"></div></div><div class="field"><label for="sb-monthly">Set aside each month</label><div class="input-wrap"><span>$</span><input id="sb-monthly" type="number" min="0" max="10000000" value="600" inputmode="decimal"></div></div></div><div class="row"><div class="field"><label for="sb-rise">Price increase per year</label><div class="input-wrap"><input id="sb-rise" type="number" min="0" max="30" step="0.1" value="3" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="sb-return">Expected return (optional)</label><div class="input-wrap"><input id="sb-return" type="number" min="0" max="20" step="0.1" value="0" inputmode="decimal"><span>%</span></div><small>Leave at 0% for cash savings.</small></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">You can buy it with cash in</span><div id="sb-time" class="result-number">—</div><div class="stat-row"><span>Around</span><strong id="sb-date">—</strong></div><div class="stat-row"><span>Price by then</span><strong id="sb-price-then">—</strong></div><div class="stat-row"><span>You'll set aside</span><strong id="sb-contrib">—</strong></div><div class="stat-row"><span>Investment growth</span><strong id="sb-growth">—</strong></div><div class="chart" id="sb-chart"></div><p id="sb-note" class="notice"></p></aside></div>
