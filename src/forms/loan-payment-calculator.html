<div class="calculator-layout"><section class="calc-card"><h2>Inputs</h2><div class="field"><label for="loan-amount">Loan amount</label><div class="input-wrap"><span>$</span><input id="loan-amount" type="number" inputmode="decimal" min="0" max="1000000000000" value="25000"></div><small>Principal borrowed before interest.</small></div><div class="row"><div class="field"><label for="loan-rate">Interest rate</label><div class="input-wrap"><input id="loan-rate" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="8"><span>%</span></div></div><div class="field"><label for="loan-term">Term</label><div class="input-wrap"><input id="loan-term" type="number" inputmode="decimal" min="1" max="100" value="5"><span>yr</span></div></div></div><div class="field"><label for="loan-extra">Extra monthly payment</label><div class="input-wrap"><span>$</span><input id="loan-extra" type="number" inputmode="decimal" min="0" max="1000000000000" value="0"></div><small>Optional amount added to the standard payment.</small></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Base monthly payment</span><div id="loan-payment" class="result-number">$507</div><div class="stat-row"><span>Time with extra payment</span><strong id="loan-time">—</strong></div><div class="stat-row"><span>Total interest</span><strong id="loan-interest">—</strong></div><div class="stat-row"><span>Total paid</span><strong id="loan-total">—</strong></div><p id="loan-note" class="notice"></p><div class="chart" id="loan-chart"></div></aside></div>
