<div class="calculator-layout"><section class="calc-card"><h2>Loan details</h2><div class="field"><label for="am-amount">Loan amount</label><div class="input-wrap"><span>$</span><input id="am-amount" type="number" min="0" max="100000000" value="300000" inputmode="decimal"></div></div><div class="row"><div class="field"><label for="am-rate">Interest rate</label><div class="input-wrap"><input id="am-rate" type="number" min="0" max="50" step="0.01" value="6.5" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="am-term">Loan term</label><div class="input-wrap"><input id="am-term" type="number" min="1" max="50" value="30" inputmode="decimal"><span>yr</span></div></div></div><div class="row"><div class="field"><label for="am-start">First payment</label><input id="am-start" type="month" placeholder="YYYY-MM"></div><div class="field"><label for="am-extra">Extra monthly payment</label><div class="input-wrap"><span>$</span><input id="am-extra" type="number" min="0" max="10000000" value="0" inputmode="decimal"></div></div></div><div class="field"><label for="am-view">Show schedule</label><select id="am-view"><option value="year" selected>By year</option><option value="month">Every monthly payment</option></select></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Monthly payment</span><div id="am-payment" class="result-number">—</div><div class="stat-row"><span>Total interest</span><strong id="am-interest">—</strong></div><div class="stat-row"><span>Total of all payments</span><strong id="am-total">—</strong></div><div class="stat-row"><span>Number of payments</span><strong id="am-count">—</strong></div><div class="stat-row"><span>Payoff date</span><strong id="am-payoff">—</strong></div><div class="chart" id="am-chart"></div><p id="am-note" class="notice"></p></aside></div><section class="schedule-card" aria-labelledby="am-sched-h"><h2 id="am-sched-h">Amortization schedule</h2><div class="schedule-wrap"><table class="sched"><thead><tr><th scope="col" id="am-col">Year</th><th scope="col">Principal</th><th scope="col">Interest</th><th scope="col">Balance</th></tr></thead><tbody id="am-rows"></tbody></table></div></section>
