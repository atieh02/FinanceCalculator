<div class="calculator-layout"><section class="calc-card"><h2>Your CD</h2><div class="field"><label for="cd-deposit">Deposit amount</label><div class="input-wrap"><span>$</span><input id="cd-deposit" type="number" min="0" max="100000000" value="10000" inputmode="decimal"></div></div><div class="row"><div class="field"><label for="cd-apy">APY</label><div class="input-wrap"><input id="cd-apy" type="number" min="0" max="25" step="0.01" value="4" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="cd-term">Term</label><select id="cd-term"><option value="3">3 months</option><option value="6">6 months</option><option value="9">9 months</option><option value="12" selected>1 year</option><option value="18">18 months</option><option value="24">2 years</option><option value="36">3 years</option><option value="48">4 years</option><option value="60">5 years</option></select></div></div><div class="row"><div class="field"><label for="cd-tax">Your tax rate on interest</label><div class="input-wrap"><input id="cd-tax" type="number" min="0" max="60" step="0.5" value="22" inputmode="decimal"><span>%</span></div><small>Federal plus state, if any.</small></div><div class="field"><label for="cd-compare">Compare with an account paying</label><div class="input-wrap"><input id="cd-compare" type="number" min="0" max="25" step="0.01" value="0.5" inputmode="decimal"><span>% APY</span></div></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Balance at maturity</span><div id="cd-balance" class="result-number">—</div><div class="stat-row"><span>Interest earned</span><strong id="cd-interest">—</strong></div><div class="stat-row"><span>Interest after tax</span><strong id="cd-aftertax">—</strong></div><div class="stat-row"><span>Other account would earn</span><strong id="cd-other">—</strong></div><div class="stat-row"><span>Extra you earn with this CD</span><strong id="cd-extra">—</strong></div><div class="chart" id="cd-chart"></div><p id="cd-note" class="notice"></p></aside></div>
