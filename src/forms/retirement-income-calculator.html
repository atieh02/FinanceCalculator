<div class="calculator-layout"><section class="calc-card"><h2>Your retirement savings</h2><div class="field"><label for="ri-savings">Savings at retirement</label><div class="input-wrap"><span>$</span><input id="ri-savings" type="number" min="0" max="1000000000" value="800000" inputmode="decimal"></div></div><div class="field"><label for="ri-withdraw">Monthly withdrawal</label><div class="input-wrap"><span>$</span><input id="ri-withdraw" type="number" min="0" max="10000000" value="4000" inputmode="decimal"></div><small>What you'll take from savings each month, after other income like Social Security.</small></div><div class="row"><div class="field"><label for="ri-return">Expected yearly return</label><div class="input-wrap"><input id="ri-return" type="number" min="0" max="15" step="0.1" value="5" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="ri-infl">Inflation</label><div class="input-wrap"><input id="ri-infl" type="number" min="0" max="15" step="0.1" value="2.5" inputmode="decimal"><span>%</span></div></div></div><div class="field"><label for="ri-years">Make it last (years)</label><div class="input-wrap"><input id="ri-years" type="number" min="1" max="60" value="30" inputmode="numeric"><span>yr</span></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Your savings would last</span><div id="ri-lasts" class="result-number">—</div><div class="stat-row"><span>Monthly amount that lasts <span id="ri-years-label">30</span> years</span><strong id="ri-sustain">—</strong></div><div class="stat-row"><span>First-year withdrawal rate</span><strong id="ri-rate">—</strong></div><div class="stat-row"><span>Total withdrawn</span><strong id="ri-total">—</strong></div><div class="chart" id="ri-chart"></div><p id="ri-note" class="notice"></p></aside></div>
