<div class="calculator-layout"><section class="calc-card"><h2>Your numbers</h2><div class="row"><div class="field"><label for="fi-age">Current age</label><input id="fi-age" type="number" min="16" max="90" value="30" inputmode="numeric"></div><div class="field"><label for="fi-spend">Yearly spending</label><div class="input-wrap"><span>$</span><input id="fi-spend" type="number" min="0" max="100000000" value="40000" inputmode="decimal"></div></div></div><div class="row"><div class="field"><label for="fi-invested">Invested so far</label><div class="input-wrap"><span>$</span><input id="fi-invested" type="number" min="0" max="1000000000" value="50000" inputmode="decimal"></div></div><div class="field"><label for="fi-save">Invested each year</label><div class="input-wrap"><span>$</span><input id="fi-save" type="number" min="0" max="100000000" value="25000" inputmode="decimal"></div></div></div><div class="row"><div class="field"><label for="fi-return">Return after inflation</label><div class="input-wrap"><input id="fi-return" type="number" min="0" max="15" step="0.1" value="5" inputmode="decimal"><span>%</span></div></div><div class="field"><label for="fi-rate">Withdrawal rate</label><div class="input-wrap"><input id="fi-rate" type="number" min="1" max="10" step="0.1" value="4" inputmode="decimal"><span>%</span></div></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Financially independent in</span><div id="fi-years" class="result-number">—</div><div class="stat-row"><span>Your FIRE number</span><strong id="fi-number">—</strong></div><div class="stat-row"><span>Age when you get there</span><strong id="fi-age-at">—</strong></div><div class="stat-row"><span>Progress today</span><strong id="fi-progress">—</strong></div><div class="chart" id="fi-chart"></div><p id="fi-note" class="notice"></p></aside></div>
