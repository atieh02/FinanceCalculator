<div class="calculator-layout"><section class="calc-card"><h2>Your goal</h2><div class="field"><label for="sg-goal">Savings goal</label><div class="input-wrap"><span>$</span><input id="sg-goal" type="number" min="0" max="1000000000000" value="30000" inputmode="decimal"></div></div><div class="field"><label for="sg-current">Already saved</label><div class="input-wrap"><span>$</span><input id="sg-current" type="number" min="0" max="1000000000000" value="5000" inputmode="decimal"></div></div><div class="row"><div class="field"><label for="sg-years">Years</label><div class="input-wrap"><input id="sg-years" type="number" min="0" max="60" value="3" inputmode="numeric"><span>yr</span></div></div><div class="field"><label for="sg-months">+ Months</label><div class="input-wrap"><input id="sg-months" type="number" min="0" max="11" value="0" inputmode="numeric"><span>mo</span></div></div></div><div class="field"><label for="sg-apy">Savings account APY</label><div class="input-wrap"><input id="sg-apy" type="number" min="0" max="30" step="0.01" value="4" inputmode="decimal"><span>%</span></div><small>High-yield savings accounts often pay several times the national average.</small></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Save this much each month</span><div id="sg-monthly" class="result-number">—</div><div class="stat-row"><span>Total you'll deposit</span><strong id="sg-deposits">—</strong></div><div class="stat-row"><span>Interest earned</span><strong id="sg-interest">—</strong></div><div class="stat-row"><span>Without interest you'd need</span><strong id="sg-nointerest">—</strong></div><div class="chart" id="sg-chart"></div><p id="sg-note" class="notice"></p></aside></div>
