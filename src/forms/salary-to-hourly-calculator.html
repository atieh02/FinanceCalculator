<div class="calculator-layout"><section class="calc-card"><h2>Your pay</h2><div class="row"><div class="field"><label for="sh-amount">Pay amount</label><div class="input-wrap"><span>$</span><input id="sh-amount" type="number" min="0" max="1000000000" step="0.01" value="75000" inputmode="decimal"></div></div><div class="field"><label for="sh-period">Per</label><select id="sh-period"><option value="hour">Hour</option><option value="day">Day</option><option value="week">Week</option><option value="biweek">Two weeks</option><option value="month">Month</option><option value="year" selected>Year</option></select></div></div><div class="row"><div class="field"><label for="sh-hours">Hours per week</label><div class="input-wrap"><input id="sh-hours" type="number" min="1" max="100" step="0.5" value="40" inputmode="decimal"><span>hrs</span></div></div><div class="field"><label for="sh-weeks">Weeks worked per year</label><div class="input-wrap"><input id="sh-weeks" type="number" min="1" max="52" value="52" inputmode="numeric"><span>wks</span></div><small>Use 50 if you take two weeks of unpaid time off.</small></div></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Hourly rate</span><div id="sh-hourly" class="result-number">—</div><table class="pay-table"><tbody><tr><td>Daily (5-day week)</td><td id="sh-day">—</td></tr><tr><td>Weekly</td><td id="sh-week">—</td></tr><tr><td>Every two weeks</td><td id="sh-biweek">—</td></tr><tr><td>Monthly</td><td id="sh-month">—</td></tr><tr class="hl"><td>Yearly</td><td id="sh-year">—</td></tr></tbody></table><p id="sh-note" class="notice"></p></aside></div>
