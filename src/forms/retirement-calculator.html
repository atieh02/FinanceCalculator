<div class="calculator-layout"><section class="calc-card"><h2>Inputs</h2><div class="row"><div class="field"><label for="age">Current age</label><input id="age" type="number" inputmode="decimal" min="18" max="90" value="30"></div><div class="field"><label for="retire-age">Retirement age</label><input id="retire-age" type="number" inputmode="decimal" min="18" max="100" value="65"></div></div><div class="field"><label for="retirement-savings">Current retirement savings</label><div class="input-wrap"><span>$</span><input id="retirement-savings" type="number" inputmode="decimal" min="0" max="1000000000000" value="50000"></div></div><div class="field"><label for="retirement-contribution">Current monthly contribution</label><div class="input-wrap"><span>$</span><input id="retirement-contribution" type="number" inputmode="decimal" min="0" max="1000000000000" value="600"></div></div><div class="field"><label for="salary">Current annual salary</label><div class="input-wrap"><span>$</span><input id="salary" type="number" inputmode="decimal" min="0" max="1000000000000" value="75000"></div><small>Used to estimate the employer contribution below.</small></div><div class="row"><div class="field"><label for="match">Employer contribution as % of salary</label><div class="input-wrap"><input id="match" type="number" inputmode="decimal" min="0" max="100" step="0.1" value="3"><span>%</span></div></div><div class="field"><label for="return-rate">Average annual return</label><div class="input-wrap"><input id="return-rate" type="number" inputmode="decimal" min="0" max="30" step="0.1" value="7"><span>%</span></div></div></div><div class="row"><div class="field"><label for="salary-growth">Annual salary/contribution growth</label><div class="input-wrap"><input id="salary-growth" type="number" inputmode="decimal" min="0" max="20" step="0.1" value="2"><span>%</span></div></div><div class="field"><label for="inflation">Inflation assumption</label><div class="input-wrap"><input id="inflation" type="number" inputmode="decimal" min="0" max="15" step="0.1" value="2.5"><span>%</span></div></div></div><div class="field"><label for="withdrawal">Illustrative first-year withdrawal rate</label><div class="input-wrap"><input id="withdrawal" type="number" inputmode="decimal" min="1" max="10" step="0.1" value="4"><span>%</span></div><small>This is an illustrative planning assumption, not a promise of a sustainable withdrawal rate.</small></div></section><aside class="result-card" aria-live="polite"><span class="result-label">Projected balance at retirement</span><div id="retirement-result" class="result-number">—</div><div class="stat-row"><span>Years to retirement</span><strong id="retirement-years">—</strong></div><div class="stat-row"><span>Illustrative first-year withdrawal</span><strong id="retirement-income">—</strong></div><div class="stat-row"><span>Approx. real return</span><strong id="retirement-real-rate">—</strong></div><p id="retirement-note" class="notice"></p><div class="chart" id="retirement-chart"></div></aside></div>
